plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.outputhub'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

// Demo packaging: serve the built frontend (frontend/dist) from the same jar.
// Build the frontend (tools/build-demo.cmd) before running Gradle so dist is current.
def frontendDist = layout.projectDirectory.dir('../frontend/dist')

tasks.named('processResources') {
    from(frontendDist) {
        into 'static'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
